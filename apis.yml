aid: candyclub
name: CandyClub
description: >-
  CandyClub is a premium candy and confectionery brand founded in 2015, best known
  for its direct-to-consumer candy subscription boxes and its wholesale program that
  supplies curated specialty candies to boutique shops, hotels, resorts, and national
  retailers. The candyclub.com storefront runs on Shopify and is agent-commerce ready:
  it publishes an llms.txt agent guide, Shopify Customer Account OpenID Connect
  authentication, and a Universal Commerce Protocol (UCP) MCP endpoint that lets AI
  shopping agents search the catalog, build carts, apply discounts, and complete
  buyer-approved checkouts. CandyClub was added to the API Evangelist network as a
  500 Global portfolio company; this profile is enriched from its public storefront,
  well-known discovery documents, and UCP/agent surface.
